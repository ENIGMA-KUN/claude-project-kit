name: Feature request
description: Suggest a new capability or a change to an existing one
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong or takes too long today? A concrete session or project helps most.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should the kit do instead? Name the skill, hook or file if you know it.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Design rules
      description: See CONTRIBUTING.md. Check the ones your proposal keeps.
      options:
        - label: Keeps human approval for anything that reaches always-on context
        - label: Adds no runtime dependency and no network call
        - label: Keeps hooks fail-open and fast
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
