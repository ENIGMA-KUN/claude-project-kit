name: test

on:
  push:
  pull_request:

jobs:
  smoke:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Smoke test (installer, graph engine, every hook event)
        run: python -B tests/smoke_test.py
      - name: Sample knowledge graph validates
        run: python -B template/.claude/kit/kg.py --root examples/sample-project validate
