<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" role="img" aria-labelledby="t d">
  <title id="t">From agents to a learning system</title>
  <desc id="d">Four steps: separate agents, a bounded loop with a budget, an explicit graph with a join, and a feedback path from verification into the knowledge graph and back into planning.</desc>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.9" fill="#e3d9c8"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a64b3c"/></marker>
    <style>
      .kicker{font:700 11px Helvetica,Arial,sans-serif;letter-spacing:2px;fill:#a8473a}
      .title{font:700 30px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-0.6px;fill:#1f1f1f}
      .h{font:700 19px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-0.3px;fill:#1f1f1f}
      .node{fill:#f4e1d2;stroke:#a65544;stroke-width:1.4}
      .key{fill:#a8473a;stroke:#7a3328;stroke-width:1.4}
      .label{font:700 10.5px Helvetica,Arial,sans-serif;fill:#262626;letter-spacing:0.4px}
      .keylabel{font:700 10.5px Helvetica,Arial,sans-serif;fill:#ffffff;letter-spacing:0.4px}
      .note{font:400 12px Helvetica,Arial,sans-serif;fill:#5b5149}
      .tiny{font:700 10px Helvetica,Arial,sans-serif;fill:#a8473a;letter-spacing:0.6px}
      .edge{stroke:#a64b3c;stroke-width:1.8;fill:none}
      .panel{fill:#fbfaf6;stroke:#b98474;stroke-width:1.2}
      .shadow{fill:#e5dbcd}
      .cell{fill:#f7f3ec;stroke:#e0d4c3;stroke-width:1}
    </style>
  </defs>
  <rect width="900" height="650" rx="16" fill="#f3efe6"/>
  <rect width="900" height="650" rx="16" fill="url(#dots)"/>
  <text x="32" y="38" class="kicker">02 / THE SYSTEM</text>
  <text x="32" y="74" class="title">From agents to a learning system</text>

  <!-- Cell 1: agents -->
  <g transform="translate(32,100)">
    <rect width="410" height="250" rx="12" class="cell"/>
    <text x="20" y="28" class="kicker">STEP 1</text>
    <text x="20" y="52" class="h">Set up the agents</text>
    <rect x="16" y="70" width="378" height="136" rx="10" class="panel"/>
    <rect x="35" y="121" width="90" height="34" rx="8" class="node"/><text x="80" y="138" dy="0.35em" text-anchor="middle" class="label">PLAN</text>
    <rect x="160" y="121" width="90" height="34" rx="8" class="node"/><text x="205" y="138" dy="0.35em" text-anchor="middle" class="label">BUILD</text>
    <rect x="285" y="121" width="90" height="34" rx="8" class="node"/><text x="330" y="138" dy="0.35em" text-anchor="middle" class="label">VERIFY</text>
    <text x="20" y="232" class="note">Skills and agents: /kit-init, recall, verifier</text>
  </g>

  <!-- Cell 2: loop -->
  <g transform="translate(458,100)">
    <rect width="410" height="250" rx="12" class="cell"/>
    <text x="20" y="28" class="kicker">STEP 2</text>
    <text x="20" y="52" class="h">Put them in a bounded loop</text>
    <rect x="16" y="70" width="378" height="136" rx="10" class="panel"/>
    <rect x="162" y="82" width="86" height="30" rx="8" class="node"/><text x="205" y="97" dy="0.35em" text-anchor="middle" class="label">BUILD</text>
    <rect x="257" y="162" width="86" height="30" rx="8" class="node"/><text x="300" y="177" dy="0.35em" text-anchor="middle" class="label">CHECK</text>
    <rect x="67" y="162" width="86" height="30" rx="8" class="node"/><text x="110" y="177" dy="0.35em" text-anchor="middle" class="label">REVISE</text>
    <line x1="228" y1="112" x2="282" y2="160" class="edge" marker-end="url(#arrow)"/>
    <line x1="255" y1="177" x2="155" y2="177" class="edge" marker-end="url(#arrow)"/>
    <line x1="128" y1="160" x2="182" y2="114" class="edge" marker-end="url(#arrow)"/>
    <text x="205" y="148" text-anchor="middle" class="tiny">MAX 3 TRIES</text>
    <text x="20" y="232" class="note">/loop-contract: stop rule, budget, escalation</text>
  </g>

  <!-- Cell 3: graph -->
  <g transform="translate(32,370)">
    <rect width="410" height="250" rx="12" class="cell"/>
    <text x="20" y="28" class="kicker">STEP 3</text>
    <text x="20" y="52" class="h">Connect the graph</text>
    <rect x="16" y="70" width="378" height="136" rx="10" class="panel"/>
    <rect x="26" y="125" width="68" height="28" rx="8" class="node"/><text x="60" y="139" dy="0.35em" text-anchor="middle" class="label">PLAN</text>
    <rect x="131" y="88" width="68" height="28" rx="8" class="node"/><text x="165" y="102" dy="0.35em" text-anchor="middle" class="label">BUILD</text>
    <rect x="131" y="162" width="68" height="28" rx="8" class="node"/><text x="165" y="176" dy="0.35em" text-anchor="middle" class="label">TEST</text>
    <rect x="228" y="125" width="68" height="28" rx="8" class="node"/><text x="262" y="139" dy="0.35em" text-anchor="middle" class="label">JOIN</text>
    <rect x="316" y="125" width="68" height="28" rx="8" class="node"/><text x="350" y="139" dy="0.35em" text-anchor="middle" class="label">VERIFY</text>
    <line x1="94" y1="132" x2="129" y2="108" class="edge" marker-end="url(#arrow)"/>
    <line x1="94" y1="146" x2="129" y2="170" class="edge" marker-end="url(#arrow)"/>
    <line x1="199" y1="108" x2="226" y2="132" class="edge" marker-end="url(#arrow)"/>
    <line x1="199" y1="170" x2="226" y2="146" class="edge" marker-end="url(#arrow)"/>
    <line x1="296" y1="139" x2="314" y2="139" class="edge" marker-end="url(#arrow)"/>
    <text x="20" y="232" class="note">Explicit routes, joins and terminal states</text>
  </g>

  <!-- Cell 4: feedback -->
  <g transform="translate(458,370)">
    <rect width="410" height="250" rx="12" class="cell"/>
    <text x="20" y="28" class="kicker">STEP 4</text>
    <text x="20" y="52" class="h">Close the feedback loop</text>
    <rect x="16" y="70" width="378" height="136" rx="10" class="panel"/>
    <rect x="26" y="106" width="68" height="28" rx="8" class="node"/><text x="60" y="120" dy="0.35em" text-anchor="middle" class="label">PLAN</text>
    <rect x="131" y="78" width="68" height="28" rx="8" class="node"/><text x="165" y="92" dy="0.35em" text-anchor="middle" class="label">BUILD</text>
    <rect x="131" y="134" width="68" height="28" rx="8" class="node"/><text x="165" y="148" dy="0.35em" text-anchor="middle" class="label">TEST</text>
    <rect x="228" y="106" width="68" height="28" rx="8" class="node"/><text x="262" y="120" dy="0.35em" text-anchor="middle" class="label">JOIN</text>
    <rect x="316" y="106" width="68" height="28" rx="8" class="node"/><text x="350" y="120" dy="0.35em" text-anchor="middle" class="label">VERIFY</text>
    <line x1="94" y1="113" x2="129" y2="96" class="edge" marker-end="url(#arrow)"/>
    <line x1="94" y1="127" x2="129" y2="144" class="edge" marker-end="url(#arrow)"/>
    <line x1="199" y1="96" x2="226" y2="113" class="edge" marker-end="url(#arrow)"/>
    <line x1="199" y1="144" x2="226" y2="127" class="edge" marker-end="url(#arrow)"/>
    <line x1="296" y1="120" x2="314" y2="120" class="edge" marker-end="url(#arrow)"/>
    <rect x="150" y="172" width="110" height="26" rx="8" class="key"/><text x="205" y="185" dy="0.35em" text-anchor="middle" class="keylabel">KNOWLEDGE</text>
    <path d="M 350 134 C 350 182, 300 185, 262 185" class="edge" marker-end="url(#arrow)"/>
    <path d="M 148 185 C 80 185, 60 170, 60 136" class="edge" marker-end="url(#arrow)"/>
    <text x="20" y="232" class="note">Lessons flow into knowledge/ and back into the plan</text>
  </g>
</svg>
